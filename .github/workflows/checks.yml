name: checks

on:
  push:
    branches: [main]
  pull_request:
    # Release PRs only change the version and changelog, and GitHub does not run workflows for
    # pull requests its own token opens, so they showed a failed run that never ran anything.
    # The push to main that follows is what checks a release.
    branches-ignore: ["release-please--**"]
  # The mod update workflow calls this on its branch, because pull requests opened with the
  # Actions token do not start other workflows.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  repo-hygiene:
    # Both OSes, because path, case and line-ending problems only show up on the checkout that trips over them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/check_repo.py
      - run: python -m pip install --quiet pytest==9.2.0 ruff==0.17.6 numpy==2.5.5
      - run: python -m ruff check tools tests
      - run: python -m pytest -q tests

  tweaks-mod:
    # The mod ships as a jar built by hand, so rebuild it and make sure the jar is this source.
    needs: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: tweaks-mod-${{ hashFiles('tools/tweaks-mod/build.gradle', 'tools/tweaks-mod/gradle/wrapper/gradle-wrapper.properties') }}
      - working-directory: tools/tweaks-mod
        run: ./gradlew build --no-daemon
      - run: cmp tools/tweaks-mod/build/libs/packpack-tweaks-1.0.0.jar pack/mods/packpack-tweaks-1.0.0.jar

  server-boot:
    needs: repo-hygiene
    # Windows too, since Sable loads a native physics library that has failed to load there
    # (Sable #1307, #1616) and half of us play on Windows. The server loads it the same way
    # the client does; a Windows client boot can't render on a runner without a GPU.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6
        with:
          path: .cache
          key: server-boot-${{ runner.os }}-${{ hashFiles('pack/pack.toml', 'tools/*.py') }}
          restore-keys: server-boot-${{ runner.os }}-
      - run: python tools/boot_server.py --java java --quiet
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-boot-${{ matrix.os }}
          path: |
            run/boot-report.json
            run/server-threads.txt
            run/server/logs/latest.log
            run/server/crash-reports/
          if-no-files-found: ignore

  worldgen:
    # Generates a patch of the ocean with four domes and checks them, since a broken dome or an
    # air pocket only shows up in generated chunks.
    needs: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6
        with:
          path: .cache
          key: worldgen-${{ hashFiles('pack/pack.toml', 'tools/*.py') }}
          restore-keys: worldgen-
      - run: python -m pip install --quiet numpy==2.5.5
      - run: python tools/boot_server.py --java java --quiet
      # The datapack and profiles in the repo have to be what the generator writes
      - run: python tools/build_worldgen.py
      - run: git diff --exit-code -- pack
      - run: python tools/check_worldgen.py --java java
      # A second seed with warm ocean between its domes, so reefs are covered too
      - run: python tools/check_worldgen.py --java java --seed 5512634387803135143
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worldgen
          path: |
            run/worldgen-report.json
            run/server/logs/latest.log
            run/server/crash-reports/
          if-no-files-found: ignore

  client-boot:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # HeadlessMC needs Java 25; the game itself runs on Java 21, set up last so it is the default.
      - id: hmc-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb x11-xserver-utils libgl1-mesa-dri
      - id: versions
        run: python -c "import tomllib; print('neoforge=' + tomllib.load(open('pack/pack.toml', 'rb'))['versions']['neoforge'])" >> "$GITHUB_OUTPUT"
      # Minecraft's libraries and NeoForge's patched jars only change with the NeoForge version.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: client-boot-${{ steps.versions.outputs.neoforge }}-${{ hashFiles('pack/pack.toml', 'tools/*.py') }}
          restore-keys: client-boot-${{ steps.versions.outputs.neoforge }}-
      - run: python tools/boot_client.py --java java --hmc-java "${{ steps.hmc-java.outputs.path }}/bin/java"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-boot
          path: |
            run/client-report.json
            run/client-launcher.log
            run/client-threads.txt
            run/client/logs/latest.log
            run/client/crash-reports/
          if-no-files-found: ignore
