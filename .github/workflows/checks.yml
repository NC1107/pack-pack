name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    # Both OSes, because path, case and line-ending problems only show up on the checkout that trips over them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/check_repo.py

  server-boot:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v6
        with:
          path: .cache
          key: boot-downloads-${{ hashFiles('pack/pack.toml', 'tools/boot_server.py') }}
          restore-keys: boot-downloads-
      - run: python tools/boot_server.py --java java --quiet
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-boot
          path: |
            run/boot-report.json
            run/server/logs/latest.log
            run/server/crash-reports/
          if-no-files-found: ignore
