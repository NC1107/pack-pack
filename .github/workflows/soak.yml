name: worldgen soak

# The checks on every pull request look at four dome slots, too few for anything rare: the
# village style and a dome missing part of its glass only showed up across 25.
on:
  schedule:
    - cron: "0 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install --quiet numpy==2.5.5
      - run: python tools/boot_server.py --java java --quiet
      - run: python tools/check_worldgen.py --java java --slots 5
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worldgen-soak
          path: |
            run/worldgen-report.json
            run/server/logs/latest.log
            run/server/crash-reports/
          if-no-files-found: ignore
