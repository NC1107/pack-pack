# Dynamic resources loads models and textures on demand instead of baking all of them at startup.
# ModernFix ships it off because a few mods with custom model code break; keep it only while the boot and client tests stay clean.
mixin.perf.dynamic_resources=true
# Lithium already removes the biome temperature cache, so let it own that patch instead of both mods overwriting the same method.
mixin.perf.remove_biome_temperature_cache=false
